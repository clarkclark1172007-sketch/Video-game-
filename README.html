 if(S.py>=G){if(S.vy>120){S.sq=.15;puff(S.px,4)}S.py=G;S.vy=0}
 if(d&&S.py>=G){S.dust-=dt;if(S.dust<=0){S.dust=.12;puff(S.px-d*8,1)}}
 for(const e of S.en){
  const dx=S.px-e.x;e.fl-=dt;e.fz-=dt;if(e.fz>0)continue;
  if(e.t=='c'){const near=Math.abs(dx)<90;e.d=near?Math.sign(dx):(Math.abs(e.x-e.x0)>50?-Math.sign(e.x-e.x0):e.d);e.x+=e.d*e.v*(near?1.5:1)*dt}
  else if(e.t=='g'){e.y=e.by+Math.sin(S.t*3+e.ph)*16;if(Math.abs(dx)<130){e.x+=Math.sign(dx)*e.v*dt;if(Math.abs(dx)<60)e.by=Math.min(190,e.by+20*dt)}}
  else{e.tm+=dt;let v=e.v+(e.mx-e.hp)*(5/Math.max(1,e.mx/12));
   if(e.kd==1)v*=(e.tm%3<.6?3:.6);if(e.kd==2)v*=.6;
   if(e.kd==4&&e.tm%4<dt)S.en.push({t:'c',x:e.x,x0:e.x,hp:1,d:1,v:40*DF[D].sp,fl:0});
   if(e.kd==3)e.y=120+Math.sin(e.tm*2)*20+(Math.abs(dx)<50?50:0);
   e.x+=Math.sign(dx)*v*dt}
  const ey=eY(e),r=e.t=='b'?24:12;
  if(S.inv<=0&&Math.abs(dx)<r&&ey>S.py-100&&ey<S.py+2)hurt(Math.sign(dx)||1,e.t=='b'?2:1)}
 for(const o of S.co)if(!o.got&&Math.abs(o.x-S.px)<14&&Math.abs(o.y-(S.py-40))<45){o.got=1;S.sc+=5;S.coins+=3;S.pw=Math.min(100,S.pw+3);SFX.coin()}
 if(S.px>W-44&&!S.en.some(e=>e.t=='b')){SFX.win();S.sc+=50;if(S.st==LV-1){S.win=1;S.over=0;sv()}else{S.shop=1;S.sel=0}}
